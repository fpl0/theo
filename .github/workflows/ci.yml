name: Deterministic checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra browser --extra embeddings
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      - run: uv run pytest -q
        env:
          THEO_TEST_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
