name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEO_TEST_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    # Standard runners are free while public; skip if visibility changes.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: false
      - name: Validate lock and install dependencies
        run: uv sync --locked --extra browser --extra embeddings
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Format
        run: uv run --no-sync ruff format --check src tests scripts
      - name: Strict type checking
        run: uv run --no-sync pyright
      - name: Offline tests
        run: uv run --no-sync pytest -q
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify installed package and bundled migrations
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/theo-wheel" --python 3.14
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/theo-wheel-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/theo-wheel/bin/python" -r "$RUNNER_TEMP/theo-wheel-requirements.txt" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/theo-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed_package.py"
