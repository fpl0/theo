          "uid": "theo-core-unavailable",
          "title": "Theo core unavailable",
          "condition": "C",
          "for": "2m",
          "keepFiringFor": "2m",
          "missing_series_evals_to_resolve": 20,
          "noDataState": "KeepLast",
          "execErrState": "KeepLast",
          "annotations": {
            "summary": "Theo core unavailable",
            "description": "Inspect the core heartbeat and supervisor recovery log on this host.",
            "measurement": "{{ with $values.B }}{{ printf \"%.3g\" .Value }}{{ else }}unavailable{{ end }} ready (1=yes)"
          },
          "labels": {
            "service": "theo",
            "severity": "critical",
            "incident": "availability",
            "host": "$THEO_ALERT_HOST",
            "environment": "{{ if $$labels.environment }}{{ $$labels.environment }}{{ else }}$THEO_ENVIRONMENT{{ end }}"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "(max by(environment)(theo_core_ready{environment=~\"local|production\"}) and on(environment) (max by(environment)(theo_database_readable{environment=~\"local|production\"}) == 1)) < bool 1",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "B",
                "expr": "max by(environment)(theo_core_ready{environment=~\"local|production\"}) and on(environment) (max by(environment)(theo_database_readable{environment=~\"local|production\"}) == 1)",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
