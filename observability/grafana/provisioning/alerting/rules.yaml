        {
          "uid": "theo-core-unavailable",
          "title": "Theo core unavailable",
          "condition": "C",
          "for": "2m",
          "noDataState": "NoData",
          "execErrState": "Error",
          "annotations": {
            "summary": "Theo core unavailable",
            "description": "Inspect native Theo logs and heartbeat; the observer remains independent.",
            "runbook_url": "http://localhost:13000/d/theo-overview"
          },
          "labels": {
            "service": "theo",
            "severity": "critical"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(theo_core_ready) < bool 1",
                "instant": true,
                "range": false,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ]
        },
        {
