[project]
name = "theo-assistant"
version = "0.1.0"
description = "A durable, SQLite-native personal assistant using native subscription runtimes"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "aiogram>=3.22,<4",
  "aiohttp>=3.14,<4",
  "mcp>=1.20,<2",
  "agent-client-protocol>=0.7,<1",
  "croniter>=6,<7",
  "httpx[socks]>=0.28,<1",
  "pillow>=11,<13",
  "pypdf>=6,<7",
  "sqlite-vec>=0.1.6,<0.2",
  "psutil>=7,<8",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.7,<1"]
browser = ["playwright>=1.55,<2"]
speech = ["mlx-whisper>=0.4,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "hypothesis>=6,<7", "ruff>=0.12,<1", "pyright>=1.1.400,<2"]

[project.scripts]
theo = "theo.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src/theo"]
